spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
    cache:
      type: redis
jwt:
  token:
    secretKey: ${JWT_SECRET:default_dummy}
    expiration:
      access: 7200000 # 2시간
      refresh: 1209600000 # 2주
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
